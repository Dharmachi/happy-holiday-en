<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1526" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="单词峡谷" />
  <title>单词峡谷 · 初中英语对战</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --bg2: #111c31;
      --panel: #16233c;
      --panel2: #1d2d4d;
      --line: #2a3f66;
      --ink: #e8eefc;
      --muted: #93a4c6;
      --gold: #f0b429;
      --gold-dim: #7a5c12;
      --ally: #4dabf7;
      --enemy: #ff6b6b;
      --ok: #51cf66;
      --bad: #ff6b6b;
      --xp: #cc5de8;
      --safe: env(safe-area-inset-bottom, 0px);
      --body: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--body);
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 50% -10%, #1e3560 0%, transparent 60%),
        radial-gradient(600px 300px at 0% 100%, #21173a 0%, transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 60%, #0a1020 100%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    .app { max-width: 820px; margin: 0 auto; padding: 14px 14px calc(28px + var(--safe)); }
    h1, h2, h3 { margin: 0 0 8px; letter-spacing: -0.01em; }
    h1 { font-size: 1.9rem; font-weight: 900; }
    h2 { font-size: 1.2rem; font-weight: 700; }
    .muted { color: var(--muted); line-height: 1.55; }
    .center { text-align: center; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row.wrap { flex-wrap: wrap; }
    .spread { justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }

    /* ---------- 通用卡片 / 按钮 ---------- */
    .card {
      background: linear-gradient(180deg, rgba(29,45,77,.9), rgba(22,35,60,.9));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card.flat { background: rgba(22,35,60,.6); }
    .btn {
      font: inherit; color: var(--ink); cursor: pointer;
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 12px; padding: 11px 15px; font-weight: 700;
      transition: transform .1s ease, filter .15s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.gold {
      background: linear-gradient(180deg, #ffd767, var(--gold));
      border-color: #ffe08a; color: #3a2a00;
      box-shadow: 0 6px 18px rgba(240,180,41,.25);
    }
    .btn.wide { width: 100%; }
    .btn.big { padding: 15px; font-size: 1.1rem; }
    .btn.ghost { background: transparent; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(240,180,41,.14); color: var(--gold);
      border: 1px solid rgba(240,180,41,.3);
      border-radius: 999px; padding: 5px 11px;
      font-size: .84rem; font-weight: 700; white-space: nowrap;
    }
    .chip.blue { background: rgba(77,171,247,.14); color: var(--ally); border-color: rgba(77,171,247,.3); }
    .chip.red { background: rgba(255,107,107,.14); color: var(--enemy); border-color: rgba(255,107,107,.3); }
    .chip.plain { background: rgba(255,255,255,.06); color: var(--muted); border-color: var(--line); }

    /* ---------- 首页 ---------- */
    .hero-title { text-align: center; margin-bottom: 14px; }
    .hero-title .sub { color: var(--gold); font-weight: 700; letter-spacing: .1em; font-size: .82rem; }
    .rank-box { text-align: center; padding: 18px 14px; }
    .rank-emoji { font-size: 3rem; line-height: 1; }
    .rank-name { font-size: 1.5rem; font-weight: 900; margin-top: 4px; }
    .stars { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
    .stars i {
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid var(--line);
    }
    .stars i.on { background: linear-gradient(180deg, #ffe08a, var(--gold)); border-color: #ffe08a; box-shadow: 0 0 10px rgba(240,180,41,.5); }

    .pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pick {
      text-align: left; position: relative; overflow: hidden;
      border: 1px solid var(--line); background: rgba(22,35,60,.75);
      border-radius: 14px; padding: 12px; cursor: pointer; font: inherit; color: inherit;
    }
    .pick:active { transform: scale(.98); }
    .pick.on { border-color: var(--gold); background: rgba(240,180,41,.1); box-shadow: 0 0 0 1px var(--gold) inset; }
    .pick.locked { opacity: .62; }
    .pick .emoji { font-size: 1.7rem; }
    .pick .nm { font-weight: 900; font-size: 1.05rem; margin-top: 2px; }
    .pick .tt { color: var(--gold); font-size: .78rem; font-weight: 700; }
    .pick .ps { color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: 6px; }
    .pick .lock { position: absolute; top: 10px; right: 10px; font-size: .78rem; }

    /* ---------- 战斗 HUD ---------- */
    .hud {
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
      margin-bottom: 10px;
    }
    .timer { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 1.05rem; }

    /* ---------- 兵线地图 ---------- */
    .lane {
      display: flex; align-items: stretch; gap: 4px;
      background: rgba(10,17,32,.55); border: 1px solid var(--line);
      border-radius: 14px; padding: 8px; margin-bottom: 10px;
    }
    .lane-side { display: flex; gap: 4px; flex: 1; }
    .lane-side.ally { flex-direction: row-reverse; }
    .bld { flex: 1; min-width: 0; text-align: center; position: relative; }
    .bld .icon { font-size: 1.1rem; line-height: 1.2; filter: grayscale(1) opacity(.35); }
    .bld.alive .icon { filter: none; }
    .bld.target .icon { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .bld .hpbar {
      height: 5px; border-radius: 999px; background: rgba(255,255,255,.09);
      overflow: hidden; margin-top: 3px;
    }
    .bld .hpbar i { display: block; height: 100%; transition: width .35s ease; }
    .bld.enemy .hpbar i { background: linear-gradient(90deg, #ff8787, var(--enemy)); }
    .bld.ally .hpbar i { background: linear-gradient(90deg, #74c0fc, var(--ally)); }
    .bld .lb { font-size: .62rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bld.target .lb { color: var(--gold); font-weight: 700; }
    .bld.dead { opacity: .3; }
    .lane-mid {
      flex: 0 0 auto; display: grid; place-items: center; padding: 0 4px;
      color: var(--muted); font-size: .7rem; font-weight: 700;
    }

    /* ---------- 英雄状态条 ---------- */
    .hstate { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .lvl {
      flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 900;
      background: radial-gradient(circle at 30% 25%, #2b4780, #16233c);
      border: 2px solid var(--gold); font-size: 1.1rem;
      position: relative;
    }
    .lvl small { position: absolute; bottom: -2px; font-size: .5rem; color: var(--muted); }
    .bars { flex: 1; min-width: 0; display: grid; gap: 5px; }
    .bar { height: 9px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
    .bar i { display: block; height: 100%; transition: width .3s ease; }
    .bar.hp i { background: linear-gradient(90deg, #69db7c, #37b24d); }
    .bar.hp.low i { background: linear-gradient(90deg, #ffa8a8, #f03e3e); }
    .bar.xp i { background: linear-gradient(90deg, #e599f7, var(--xp)); }
    .bar span {
      position: absolute; inset: 0; text-align: center;
      font-size: .6rem; line-height: 9px; font-weight: 700;
      color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }
    .combo {
      flex: 0 0 auto; text-align: center; min-width: 46px;
      color: var(--gold); font-weight: 900; line-height: 1.1;
    }
    .combo small { display: block; font-size: .58rem; color: var(--muted); font-weight: 500; }

    /* ---------- 题目 ---------- */
    .qcard { position: relative; }
    .qtag {
      display: inline-flex; align-items: center; gap: 5px; margin-bottom: 8px;
      font-size: .76rem; font-weight: 700; border-radius: 999px; padding: 4px 10px;
    }
    .qtag.minion { background: rgba(255,255,255,.08); color: var(--muted); }
    .qtag.skill { background: rgba(77,171,247,.16); color: var(--ally); }
    .qtag.ult { background: linear-gradient(90deg, rgba(240,180,41,.25), rgba(204,93,232,.25)); color: var(--gold); }
    .qmain { font-size: 1.75rem; font-weight: 900; line-height: 1.25; word-break: break-word; margin: 4px 0 2px; }
    .qmain.en { letter-spacing: -0.01em; }
    .qsub { color: var(--muted); font-size: .92rem; line-height: 1.5; }
    .qipa { color: var(--gold); font-size: .88rem; }
    .qsent { font-size: 1.15rem; line-height: 1.6; font-weight: 500; }
    .qsent b { color: var(--gold); }
    .blankmark { color: var(--gold); font-weight: 900; letter-spacing: .1em; }
    .speak {
      background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--ink);
      border-radius: 999px; padding: 4px 11px; font: inherit; font-size: .8rem; cursor: pointer;
    }
    /* 单词分级进度条 */
    .lvbar {
      display: flex; height: 14px; border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,.06); border: 1px solid var(--line);
    }
    .lvbar i { display: block; height: 100%; transition: width .3s; }
    .lvlegend {
      display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 9px;
      font-size: .76rem; color: var(--muted);
    }
    .lvlegend span { display: inline-flex; align-items: center; gap: 5px; }
    .lvlegend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    .grad { background: var(--gold); }
    .l4 { background: #6ad48f; }
    .l3 { background: #4aa8e0; }
    .l2 { background: #8b7ce0; }
    .l1 { background: #d8734f; }
    .none { background: #3a4459; }

    /* 听写题：不能露出单词，只给一个大的重播键 */
    .big-speak {
      font: inherit; font-size: 1.25rem; font-weight: 700; cursor: pointer;
      color: var(--gold); background: rgba(240,180,41,.12);
      border: 1px solid rgba(240,180,41,.4); border-radius: 16px;
      padding: 18px 26px; min-width: 200px;
    }
    .big-speak:active { transform: scale(.97); }

    .choices { display: grid; gap: 8px; margin-top: 12px; }
    .choices.two { grid-template-columns: 1fr 1fr; }
    .choice {
      font: inherit; color: var(--ink); cursor: pointer; text-align: center;
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 12px; font-size: 1.05rem; font-weight: 500;
      min-height: 52px; transition: transform .1s ease;
    }
    .choice:active { transform: scale(.98); }
    .choice.ok { border-color: var(--ok); background: rgba(81,207,102,.18); font-weight: 700; }
    .choice.bad { border-color: var(--bad); background: rgba(255,107,107,.18); }
    .choice:disabled { cursor: default; }

    .spellin {
      width: 100%; margin-top: 12px; padding: 14px; border-radius: 12px;
      background: rgba(10,17,32,.7); border: 1px solid var(--line); color: var(--ink);
      font: inherit; font-size: 1.3rem; text-align: center; font-weight: 700;
      letter-spacing: .04em;
    }
    .spellin:focus { outline: none; border-color: var(--gold); }
    .spellin.ok { border-color: var(--ok); }
    .spellin.bad { border-color: var(--bad); }

    .pool { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .line-box {
      display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
      min-height: 50px; margin-top: 10px; padding: 10px;
      background: rgba(10,17,32,.6); border: 1px dashed var(--line); border-radius: 12px;
    }
    .wchip {
      font: inherit; color: var(--ink); cursor: pointer; font-weight: 600;
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 11px;
    }
    .wchip:active { transform: scale(.96); }

    .fb { margin-top: 10px; border-radius: 12px; padding: 11px 12px; line-height: 1.55; font-size: .92rem; }
    .fb.ok { background: rgba(81,207,102,.14); color: #b2f2bb; border: 1px solid rgba(81,207,102,.3); }
    .fb.bad { background: rgba(255,107,107,.14); color: #ffc9c9; border: 1px solid rgba(255,107,107,.3); }
    .fb b { color: #fff; }

    /* ---------- 技能栏 ---------- */
    /* 吸底：题目再长也不用滚回来点技能，对限时的对战很关键 */
    .skillbar {
      display: flex; gap: 8px; margin-top: 12px;
      position: sticky; bottom: 0; z-index: 20;
      padding-bottom: calc(6px + var(--safe));
      background: linear-gradient(180deg, rgba(11,18,32,0) 0%, rgba(11,18,32,.9) 26%, rgba(11,18,32,.96) 100%);
    }
    .skill {
      flex: 1; position: relative; overflow: hidden;
      font: inherit; color: var(--ink); cursor: pointer;
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 14px; padding: 10px 6px 8px; text-align: center;
    }
    .skill:active { transform: scale(.97); }
    .skill .sk-key { font-size: 1.25rem; font-weight: 900; line-height: 1.1; }
    .skill .sk-nm { font-size: .68rem; color: var(--muted); margin-top: 2px; }
    .skill.ready { border-color: var(--gold); box-shadow: 0 0 12px rgba(240,180,41,.2) inset; }
    .skill.ready .sk-key { color: var(--gold); }
    .skill.ult.ready { border-color: var(--xp); box-shadow: 0 0 14px rgba(204,93,232,.25) inset; }
    .skill.ult.ready .sk-key { color: #e599f7; }
    .skill:disabled { cursor: default; opacity: .8; }
    .skill .cd {
      position: absolute; inset: 0; background: rgba(6,10,20,.72);
      display: grid; place-items: center; font-weight: 900; font-size: 1.1rem;
      color: #fff; font-variant-numeric: tabular-nums;
    }
    .skill .cd small { display: block; font-size: .6rem; font-weight: 500; color: var(--muted); }

    /* ---------- 遮罩层 ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(5,9,18,.94);
      display: grid; place-items: center; padding: 18px;
      overflow-y: auto;
    }
    .sheet {
      width: 100%; max-width: 520px;
      background: linear-gradient(180deg, #1b2a48, #131f36);
      border: 1px solid var(--line); border-radius: 20px; padding: 18px;
      max-height: 100%; overflow-y: auto;
    }
    .dead-title { font-size: 1.6rem; font-weight: 900; color: var(--enemy); }
    .dead-cd {
      width: 74px; height: 74px; margin: 12px auto; border-radius: 50%;
      display: grid; place-items: center; font-size: 2rem; font-weight: 900;
      border: 3px solid var(--enemy); color: var(--enemy);
      font-variant-numeric: tabular-nums;
    }
    .learnbox {
      text-align: left; background: rgba(10,17,32,.6);
      border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0;
    }
    .learnbox .k { color: var(--gold); font-weight: 900; font-size: 1.3rem; }
    .learnbox .v { margin-top: 4px; font-size: 1.05rem; }
    .learnbox .ex { margin-top: 10px; color: var(--muted); font-size: .9rem; line-height: 1.6; }

    .shop-item {
      display: flex; gap: 10px; align-items: center; text-align: left;
      width: 100%; font: inherit; color: var(--ink); cursor: pointer;
      background: rgba(22,35,60,.8); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px; margin-bottom: 8px;
    }
    .shop-item .emoji { font-size: 1.6rem; flex: 0 0 auto; }
    .shop-item .nm { font-weight: 800; }
    .shop-item .ds { color: var(--muted); font-size: .82rem; line-height: 1.4; }
    .shop-item .pz { flex: 0 0 auto; color: var(--gold); font-weight: 900; font-size: .92rem; }
    .shop-item.owned { opacity: .55; }
    .shop-item:disabled { opacity: .45; cursor: default; }

    .grade-badge {
      font-size: 3.4rem; font-weight: 900; line-height: 1;
      background: linear-gradient(180deg, #ffe08a, var(--gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
    .kv:last-child { border-bottom: 0; }
    .kv span:last-child { font-weight: 800; }

    .flash-dmg {
      position: fixed; left: 50%; top: 34%; transform: translateX(-50%);
      z-index: 40; pointer-events: none;
      font-size: 2.4rem; font-weight: 900; color: var(--gold);
      text-shadow: 0 2px 12px rgba(0,0,0,.7);
      animation: floatUp .85s ease-out forwards;
    }
    .flash-dmg.bad { color: var(--enemy); }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 12px) scale(.7); }
      25% { opacity: 1; transform: translate(-50%, -6px) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -52px) scale(1); }
    }

    .toast {
      position: fixed; left: 50%; bottom: calc(22px + var(--safe)); transform: translateX(-50%);
      z-index: 45; pointer-events: none; max-width: 88%;
      background: rgba(10,17,32,.94); border: 1px solid var(--gold);
      color: var(--gold); border-radius: 999px; padding: 9px 16px;
      font-weight: 700; font-size: .88rem; text-align: center;
      animation: toastIn 2.2s ease forwards;
    }
    @keyframes toastIn {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      12%, 78% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -6px); }
    }

    .backlink { display: inline-block; margin-top: 14px; color: var(--muted); font-size: .86rem; }

    /* ---------- 平板：字和点击区都放大 ---------- */
    @media (min-width: 700px) {
      html { font-size: 18px; }
      .app { padding: 18px 20px calc(30px + var(--safe)); }
      .pick-grid { grid-template-columns: 1fr 1fr; }
      .choices { grid-template-columns: 1fr 1fr; }
      .choice { min-height: 66px; padding: 18px 14px; font-size: 1.12rem; }
      .qmain { font-size: 2.1rem; }
      .qsent { font-size: 1.3rem; }
      .lane { padding: 10px; }
      .bld .icon { font-size: 1.45rem; }
      .bld .hpbar { height: 7px; }
      .bld .lb { font-size: .7rem; }
      .lvl { width: 54px; height: 54px; font-size: 1.3rem; }
      .bar { height: 12px; }
      .bar span { line-height: 12px; font-size: .66rem; }
      .skill { padding: 14px 8px 12px; }
      .skill .sk-key { font-size: 1.55rem; }
      .skill .sk-nm { font-size: .76rem; }
      .wchip { padding: 12px 15px; font-size: 1.05rem; }
      .spellin { font-size: 1.5rem; padding: 16px; }
      .sheet { max-width: 620px; padding: 22px; }
      .dead-cd { width: 88px; height: 88px; font-size: 2.4rem; }
      .shop-item { padding: 14px; }
    }

    /* ---------- 平板横屏 / 桌面：题目和状态分两栏，一屏放得下 ---------- */
    @media (min-width: 1000px) {
      .app { max-width: 1040px; }
      .app.battle { max-width: 1140px; }
      .battle-main {
        display: grid; grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px; align-items: start;
      }
      .battle-main .col-q { grid-column: 1; grid-row: 1; }
      .battle-main .col-side { grid-column: 2; grid-row: 1; }
      .pick-grid.heroes { grid-template-columns: repeat(4, 1fr); }
      .pick-grid.diffs { grid-template-columns: repeat(3, 1fr); }
      .qmain { font-size: 2.3rem; }
    }

    /* ---------- 手机横屏：屏幕太矮，压缩纵向占用 ---------- */
    @media (max-height: 520px) and (min-width: 640px) {
      html { font-size: 15px; }
      .card { padding: 11px; }
      .qmain { font-size: 1.55rem; }
      .qsent { font-size: 1.05rem; }
      .choice { min-height: 46px; padding: 11px 12px; }
      .lane { padding: 6px; margin-bottom: 8px; }
      .hstate { margin-bottom: 8px; }
      .skillbar { margin-top: 8px; }
      .hero-title { margin-bottom: 8px; }
    }

    /* 只给真正的小屏手机降字号，别把 390px 宽的主流机型也缩了 */
    @media (max-width: 370px) {
      html { font-size: 15px; }
      .qmain { font-size: 1.5rem; }
      .pick-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bld.target .icon, .flash-dmg, .toast { animation: none; }
    }
  </style>
</head>
